name: Browser companion
on:
  push:
    paths: ['browser-extension/**', 'facebook-extension/**', 'browser_bridge.py', 'mediaforge/**', 'tests/test_browser_bridge.py', 'tests/test_browser_posting.py', 'tests/test_drive_picker.py', 'tests/test_export_submissions.py', 'tests/test_source_tracks.py', 'tests/test_processing_limits.py', 'tests/test_desktop.py', 'tests/*regressions.*', '.github/workflows/browser-companion.yml']
  pull_request:
    paths: ['browser-extension/**', 'facebook-extension/**', 'browser_bridge.py', 'mediaforge/**', 'tests/test_browser_bridge.py', 'tests/test_browser_posting.py', 'tests/test_drive_picker.py', 'tests/test_export_submissions.py', 'tests/test_source_tracks.py', 'tests/test_processing_limits.py', 'tests/test_desktop.py', 'tests/*regressions.*', '.github/workflows/browser-companion.yml']
permissions:
  contents: read
jobs:
  protocol-and-extension:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_browser_bridge.py tests/test_desktop.py tests/test_browser_posting.py tests/test_drive_picker.py tests/test_export_submissions.py tests/test_source_tracks.py tests/test_processing_limits.py -m "not integration"
      - run: node tests/extension_regressions.mjs
      - run: node tests/facebook_companion_regressions.mjs
      - run: node tests/facebook_page_regressions.mjs
      - run: node tests/export_submission_regressions.cjs
      - run: node tests/source_tracks_regressions.cjs
