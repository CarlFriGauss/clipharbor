name: Browser companion
on:
  push:
    paths: ['browser-extension/**', 'browser_bridge.py', 'mediaforge/**', 'tests/test_browser_bridge.py', 'tests/test_desktop.py', 'tests/extension_regressions.mjs', '.github/workflows/browser-companion.yml']
  pull_request:
    paths: ['browser-extension/**', 'browser_bridge.py', 'mediaforge/**', 'tests/test_browser_bridge.py', 'tests/test_desktop.py', 'tests/extension_regressions.mjs', '.github/workflows/browser-companion.yml']
permissions:
  contents: read
jobs:
  protocol-and-extension:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_browser_bridge.py tests/test_desktop.py
      - run: node tests/extension_regressions.mjs
